apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: dynamic-applicationset
  namespace: argocd

spec:

  generators:
    - git:
        repoURL: https://github.com/hatif007/argo-demo-repo.git
        revision: MAIN3

        directories:
          - path: 'my-project/qa/*'

  template:

    metadata:
      name: 'dynamic-{{team}}-{{env}}'
      

    spec:
      project: my-project

      source:
        repoURL: https://github.com/hatif007/argo-demo-repo.git
        targetRevision: MAIN3
        path: 'my-project/qa/*'

      destination:
        server: https://kubernetes.default.svc
        namespace: 'dynamic-{{team}}-{{env}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true