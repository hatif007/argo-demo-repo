apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example-applicationset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: dev
            team: team-a
          - cluster: qa
            team: team-a
  template:
    metadata:
      name: '{{team}}-{{cluster}}'
    spec:
      project:  my-project
      source:
        repoURL: https://github.com/hatif007/argo-demo-repo.git
        targetRevision: MAIN2
        path: my-project
        directory:
          include: 'team-a-{{cluster}}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{team}}-{{cluster}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true